  function tint(img, hex) {
    const c = document.createElement('canvas')
    c.width = img.width
    c.height = img.height
    const x = c.getContext('2d')
    x.drawImage(img, 0, 0)

  // `track` adds that share of the cap height after each letter.
  function textWidth(str, cap, track = 0) {
    const s = cap / ATLAS.capH
    let w = 0

    const s = cap / ATLAS.capH

    else { ctx.moveTo(x, y); ctx.lineTo(x, y + h) }
    if (ends === 'right' || ends === 'both') { ctx.lineTo(x + w - r, y + h); ctx.arc(x + w - r, y + r, r, Math.PI / 2, -Math.PI / 2, true) }
    else { ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y) }
    ctx.closePath()
    ctx.fill()
  }
  // Draw once into an offscreen canvas the size of the screen (for the parts
  // that do not move, so a glow is not recomputed on every frame).
  function offscreen(paint) {
    const c = document.createElement('canvas')
    c.width = canvas.width
    c.height = canvas.height
    const saved = ctx
    ctx = c.getContext('2d')
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    try { paint() } finally { ctx = saved }
    return c
  }

  let W = 0, H = 0, DPR = 1, L = null

  // ── scene ──
  /*
   * The Motion Picture: the K't'inga's tactical display (frames 50, 58, 92,
   * 94), in the colours measured on the film (tools/film-evidence.md).
   *
   * One screen in its bevelled amber-brown housing. Inside: the red triangle
   * lattice in an elongated hexagon, cells flickering; the orange ship symbol
   * (traced from frame 92) in its blinking target box; a cyan-white contact
   * that closes in and resets; three torpedoes that light in turn on the line
   * to it; rows of Klingon-style glyphs (original, tools/glyphs.py) that
   * change; the orange triangle marker. The app's name sits under the grid.
   */
  const SEED = 1979
  const TAU = Math.PI * 2
  const SQ3 = Math.sqrt(3)
  const glow = (colour, b) => { ctx.shadowColor = colour; ctx.shadowBlur = b * DPR }
  const noGlow = () => { ctx.shadowBlur = 0 }

  function octagon(x0, y0, x1, y1, b) {
    ctx.beginPath()
    ctx.moveTo(x0 + b, y0); ctx.lineTo(x1 - b, y0); ctx.lineTo(x1, y0 + b); ctx.lineTo(x1, y1 - b)
    ctx.lineTo(x1 - b, y1); ctx.lineTo(x0 + b, y1); ctx.lineTo(x0, y1 - b); ctx.lineTo(x0, y0 + b)
    ctx.closePath()
  }
  function hexPath(cx, cy, hw, hh, d) {
    ctx.beginPath()
    ctx.moveTo(cx - hw, cy); ctx.lineTo(cx - hw + d, cy - hh); ctx.lineTo(cx + hw - d, cy - hh)
    ctx.lineTo(cx + hw, cy); ctx.lineTo(cx + hw - d, cy + hh); ctx.lineTo(cx - hw + d, cy + hh)
    ctx.closePath()
  }
  function polyPath(pts, ox, oy, s) {
    ctx.beginPath()
    pts.forEach(([x, y], i) => i ? ctx.lineTo(ox + x * s, oy + y * s) : ctx.moveTo(ox + x * s, oy + y * s))
    ctx.closePath()
  }
  // One glyph (a list of polygons in a 0.72 x 1 box), h tall, top-left at (x, y).
  function glyphPath(g, x, y, h) {
    ctx.beginPath()
    for (const poly of g) poly.forEach(([px, py], i) => i ? ctx.lineTo(x + px * h, y + py * h) : ctx.moveTo(x + px * h, y + py * h))
    ctx.closePath()
  }
  function glyphRow(row, x, y, h, colour) {
    ctx.fillStyle = colour
    let cx = x
    for (const g of row) { glyphPath(g, cx, y, h); ctx.fill(); cx += 0.9 * h }
  }
  const pickRow = n => Array.from({ length: n }, () => pick(C.glyphs))

  // The triangle lattice: horizontals every s*sqrt(3)/2, diagonals at 60 degrees.
  function lattice(x0, y0, x1, y1, s, colour, width) {
    const h = s * SQ3 / 2
    ctx.strokeStyle = colour
    ctx.lineWidth = width
    ctx.beginPath()
    for (let y = y0; y <= y1 + 1; y += h) { ctx.moveTo(x0, y); ctx.lineTo(x1, y) }
    const span = (y1 - y0) / SQ3
    for (let x = x0 - span; x <= x1 + 1; x += s) {
      ctx.moveTo(x, y0); ctx.lineTo(x + span, y1)
      ctx.moveTo(x + span, y0); ctx.lineTo(x, y1)
    }
    ctx.stroke()
  }
  // The lattice triangle holding (px, py): three corners.
  function cellAt(px, py, x0, y0, s) {
    const h = s * SQ3 / 2
    const r = Math.floor((py - y0) / h)
    const top = y0 + r * h, bot = top + h
    const f = (py - top) / h
    // Columns of alternating up and down triangles; the row's x offset shifts by s/2 on odd rows.
    const sh = (r % 2 === 0 ? 0 : s / 2)
    const lx = px - x0 - sh
    const k = Math.floor(lx / s)
    const a = x0 + sh + k * s
    const u = (lx - k * s) / s
    // Down-pointing triangle covers points where |u - 0.5| <= (1 - f) / 2.
    if (Math.abs(u - 0.5) <= (1 - f) / 2) return [[a, top], [a + s, top], [a + s / 2, bot]]
    return u < 0.5 ? [[a, top], [a + s / 2, bot], [a - s / 2, bot]] : [[a + s, top], [a + s * 1.5, bot], [a + s / 2, bot]]
  }

  function layout(OX, OY) {
    const VW = W - OX, VH = H - OY
    const u = Math.max(7, Math.min(22, Math.min(VW / 60, VH / 42)))
    const pad = 1.0 * u
    const x0 = OX + pad, x1 = W - pad, y0 = OY + pad, y1 = H - pad
    const t = 2.2 * u
    const scr = { x: x0 + t, y: y0 + t, w: x1 - x0 - 2 * t, h: y1 - y0 - 2 * t }
    // The hexagon: 0.82 of the screen wide, pointed left and right (frame 92).
    const cx = scr.x + scr.w / 2, cy = scr.y + 0.46 * scr.h
    const hw = 0.42 * scr.w, hh = Math.min(0.34 * scr.h, 0.46 * hw), d = 0.27 * hw
    const s = Math.max(14, Math.min(0.06 * scr.w, 0.11 * scr.h))
    const lat = { x0: cx - hw, y0: cy - hh, x1: cx + hw, y1: cy + hh, s }
    const sym = Math.min(0.26 * hw, 0.75 * hh)
    const flick = []
    for (let i = 0; i < 12; i++) {
      flick.push({ x: cx - 0.7 * hw + rnd() * 1.4 * hw, y: cy - 0.8 * hh + rnd() * 1.6 * hh, period: 1.6 + rnd() * 2.2, phase: rnd() })
    }
    const labels = [
      { x: cx + 0.26 * hw, y: cy - 0.8 * hh, n: 12, h: 1.1 * u, step: 1.1, phase: rnd(), row: null },
      { x: cx - 0.9 * hw, y: cy - 0.55 * u, n: 9, h: 1.1 * u, step: 1.3, phase: rnd(), row: null },
      { x: cx - 0.46 * hw, y: cy + 0.68 * hh, n: 6, h: 1.1 * u, step: 0.9, phase: rnd(), row: null },
    ]
    for (const l of labels) l.row = pickRow(l.n)
    const capName = Math.min(1.5 * u, 0.045 * scr.w)
    L = { u, x0, y0, x1, y1, t, scr, cx, cy, hw, hh, d, lat, sym, flick, labels, capName,
      contact: { t0: 0, from: [cx - 0.62 * hw, cy - 0.55 * hh], to: [cx - 0.3 * sym - 0.9 * u, cy - 0.3 * u], dur: 7.5 } }
    L.bg = offscreen(paintStatic)
  }

  function paintStatic() {
    const { u, x0, y0, x1, y1, t, scr, cx, cy, hw, hh, d, lat } = L
    rect(0, 0, W, H, '#000')
    // The housing: amber-brown with cut corners, a lighter rim, black glass.
    const b = 4 * u
    ctx.fillStyle = C.housing
    octagon(x0, y0, x1, y1, b); ctx.fill()
    ctx.strokeStyle = C.rim
    ctx.lineWidth = Math.max(1, 0.2 * u)
    octagon(x0 + 0.5 * u, y0 + 0.5 * u, x1 - 0.5 * u, y1 - 0.5 * u, b - 0.5 * u); ctx.stroke()
    ctx.fillStyle = '#000'
    octagon(scr.x, scr.y, scr.x + scr.w, scr.y + scr.h, b - t); ctx.fill()
    // The lattice, clipped to the hexagon, with its glow.
    ctx.save()
    hexPath(cx, cy, hw, hh, d); ctx.clip()
    glow(C.lattice, 0.4 * u)
    lattice(lat.x0, lat.y0, lat.x1, lat.y1, lat.s, C.lattice_line, Math.max(1, 0.09 * u))
    ctx.restore()
    glow(C.lattice, 0.6 * u)
    ctx.strokeStyle = C.lattice
    ctx.lineWidth = Math.max(1.5, 0.22 * u)
    hexPath(cx, cy, hw, hh, d); ctx.stroke()
    // The app's name under the grid.
    glow(C.glyph, 0.4 * u)
    text(C.name, cx, scr.y + scr.h - 1.1 * u, L.capName, C.glyph, 'c', 0.12)
    noGlow()
  }

  function draw(t) {
    const { u, cx, cy, hw, hh, lat, sym } = L
    noGlow()
    ctx.drawImage(L.bg, 0, 0, W, H)
    ctx.save()
    hexPath(cx, cy, hw, hh, L.d); ctx.clip()
    // Flickering cells.
    glow(C.lattice, 0.5 * u)
    for (const f of L.flick) {
      const ph = ((t / f.period) + f.phase) % 1
      if (ph < 0.3) {
        ctx.globalAlpha = 0.4 * (1 - ph / 0.3)
        const c = cellAt(f.x, f.y, lat.x0, lat.y0, lat.s)
        polyPath(c, 0, 0, 1)
        ctx.fillStyle = C.lattice
        ctx.fill()
      }
    }
    ctx.globalAlpha = 1
    // The target box, blinking.
    if ((t % 1.2) < 0.85) {
      ctx.strokeStyle = C.lattice
      ctx.lineWidth = Math.max(1.5, 0.2 * u)
      hexPath(cx, cy, 0.95 * sym, 0.5 * sym, 0.3 * sym); ctx.stroke()
    }
    // The ship symbol.
    glow(C.ship, 0.7 * u)
    ctx.fillStyle = C.ship
    polyPath(C.symbol, cx, cy - 0.02 * sym, 1.15 * sym)
    ctx.fill()
    // The contact closing in.
    const k = Math.max(0, Math.min(1, (t - L.contact.t0) / L.contact.dur))
    const e = k * k * (3 - 2 * k)
    const px = L.contact.from[0] + (L.contact.to[0] - L.contact.from[0]) * e
    const py = L.contact.from[1] + (L.contact.to[1] - L.contact.from[1]) * e
    glow(C.contact, 1.4 * u)
    ctx.fillStyle = C.contact
    ctx.globalAlpha = 0.9
    const r = 0.75 * u
    ctx.beginPath()
    for (let i = 0; i < 6; i++) { const a = TAU * i / 6 + TAU / 12; ctx.lineTo(px + r * Math.cos(a), py + r * Math.sin(a)) }
    ctx.closePath(); ctx.fill()
    ctx.globalAlpha = 1
    // Torpedoes: three dots on the line from the ship to the contact, lit in turn.
    const lit = Math.floor(t / 0.45) % 4
    glow(C.torpedo, 0.9 * u)
    ctx.fillStyle = C.torpedo
    for (let i = 0; i < 3; i++) {
      if (i !== lit) continue
      const q = 0.3 + 0.2 * i
      const tx = cx + (px - cx) * q, ty = cy + (py - cy) * q
      ctx.beginPath(); ctx.arc(tx, ty, 0.32 * u, 0, TAU); ctx.fill()
    }
    // Glyph labels.
    glow(C.glyph, 0.35 * u)
    for (const l of L.labels) glyphRow(l.row, l.x, l.y, l.h, C.glyph)
    ctx.restore()
    // The orange marker, lower right, blinking.
    if ((t % 1.6) < 1.1) {
      glow(C.ship, 0.5 * u)
      ctx.fillStyle = C.ship
      const mx = cx + 0.72 * hw, my = cy + hh + 0.4 * u
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + 1.1 * u, my); ctx.lineTo(mx + 0.55 * u, my + 0.9 * u); ctx.closePath(); ctx.fill()
    }
    noGlow()
    if (k >= 1) L.contact.t0 = t + 0.6
  }

  function tick(dt) {
    const p = Math.min(1, dt * 10)
    for (const l of L.labels) if (Math.random() < p / (l.step * 10)) {
      l.row[(Math.random() * l.row.length) | 0] = pick(C.glyphs)
    }
  }
  // ── end of scene ──

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1)
    W = Math.max(1, window.innerWidth)
    H = Math.max(1, window.innerHeight)
    canvas.width = Math.round(W * DPR)
    canvas.height = Math.round(H * DPR)
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    seed = SEED
    // The dashboard paints its nav, session list and chat header above
    // overlays, so the scene is laid out in the area they leave visible.
    layout(W >= 1100 ? 520 : W >= 768 ? 250 : 0, W >= 768 ? 96 : 56)
  }

  loadImage(ATLAS.src).then(img => {
    ATLAS.img = img
    resize()
    window.addEventListener('resize', () => { resize(); draw(0) })
    draw(0)
    canvas.classList.add('on')
    const shownAt = performance.now()
    let raf = 0, stopped = false, last = shownAt, acc = 0
    const stop = () => { stopped = true; cancelAnimationFrame(raf) }
    const dismiss = () => {
      if (stopped) return
      stop()
      try { parent.postMessage({ type: 'theme:visibility', visible: false }, '*') } catch {}
    }
    // A browser can fire a synthetic mousemove when the frame appears under a
    // still pointer, so movement counts only after 1.5 s and beyond 8 px.
    let origin = null
    window.addEventListener('pointermove', e => {
      if (performance.now() - shownAt < 1500) return
      if (!origin) { origin = [e.clientX, e.clientY]; return }
      if (Math.hypot(e.clientX - origin[0], e.clientY - origin[1]) > 8) dismiss()
    })
    window.addEventListener('pointerdown', e => { e.preventDefault(); dismiss() })
    window.addEventListener('wheel', dismiss, { passive: true })
    window.addEventListener('keydown', dismiss)
    if (reduced) return
    const STEP = 0.1, SLEEP_AT = 30 * 60
    function frame(ts) {
      if (stopped) return
      acc += Math.min(0.5, (ts - last) / 1000)
      last = ts
      if (acc >= STEP) {
        tick(acc)
        acc = 0
        draw((ts - shownAt) / 1000)
        if ((ts - shownAt) / 1000 > SLEEP_AT && canvas.classList.contains('on')) {
          canvas.style.transition = 'opacity 3s linear'
          canvas.classList.remove('on')
          setTimeout(stop, 3200)
        }
      }
      raf = requestAnimationFrame(frame)
    }
    raf = requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
